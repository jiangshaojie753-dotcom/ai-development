<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173f3a" />
    <meta
      name="description"
      content="本地优先的雅思学习记录、可比训练趋势与阶段复盘。"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'; worker-src 'self'"
    />
    <title>IELTS Tracker · 学习工作台</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到主要内容</a>
    <aside class="sidebar">
      <a href="#dashboard" class="brand"
        ><span class="brand-icon">it<span>↗</span></span
        ><span>IELTS <b>Tracker</b><small>一点积累，一步进步</small></span></a
      >
      <div class="nav-caption">学习工作台 <span>V2</span></div>
      <nav aria-label="主导航">
        <a href="#vocabulary" data-page="vocabulary"
          ><span aria-hidden="true">▧</span>Vocabulary Hub</a
        >
        <a href="#dashboard" data-page="dashboard"
          ><span aria-hidden="true">▦</span>每日计划</a
        >
        <a href="#training" data-page="training"
          ><span aria-hidden="true">◫</span>四科训练</a
        >
        <a href="#trends" data-page="trends"
          ><span aria-hidden="true">↗</span>进步趋势</a
        >
        <a href="#errors" data-page="errors"
          ><span aria-hidden="true">▤</span>纠错库
          <span id="error-count" class="nav-count">0</span></a
        >
        <a href="#stages" data-page="stages"
          ><span aria-hidden="true">◎</span>阶段复盘</a
        >
        <a href="#data" data-page="data"
          ><span aria-hidden="true">⇄</span>数据与同步</a
        >
      </nav>
      <div class="sidebar-note">
        <span class="eyebrow">KEEP SHOWING UP</span>
        <p>记录真实的练习，<br />看见自己的进步。</p>
        <small>每次练习，都是下一步的起点。</small>
      </div>
      <div class="storage-badge">
        <span class="status-dot"></span
        ><span id="storage-status">仅本机存储</span
        ><small>学习数据由你掌握</small>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span
          >我的学习空间 <span class="slash">/</span>
          <b id="page-name">每日计划</b></span
        ><span class="top-right"
          ><span id="offline-status">本地优先</span
          ><span class="avatar" aria-label="个人学习空间">我</span></span
        >
      </header>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <main id="main" tabindex="-1"></main>
      <footer>IELTS Tracker V2 <span>真实记录 · 持续进步</span></footer>
    </div>
    <dialog id="editor" aria-labelledby="editor-title">
      <div class="dialog-head">
        <h2 id="editor-title"></h2>
        <button type="button" class="icon-button" data-close aria-label="关闭">
          ×
        </button>
      </div>
      <form id="editor-form">
        <div id="editor-fields"></div>
        <p id="form-error" role="alert"></p>
        <div class="dialog-actions">
          <button type="button" data-close>取消</button
          ><button class="primary" type="submit">保存记录</button>
        </div>
      </form>
    </dialog>
    <noscript
      >请启用 JavaScript
      以使用本地学习记录。数据仅保存在当前浏览器中。</noscript
    >
  </body>
</html>
